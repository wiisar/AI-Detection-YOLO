[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "yolov3-project"
version = "0.2.0"
description = "Interface scolaire pour entrainer et utiliser le YOLOv3 classique."
requires-python = ">=3.9,<3.15"
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.23.5",
    "opencv-python>=4.6.0",
    "packaging>=25.0",
    "pandas>=1.1.4",
    "pillow>=10.3.0",
    "psutil>=5.9.0",
    "pyyaml>=5.3.1",
    "requests>=2.32.2",
    "scipy>=1.4.1",
    "seaborn>=0.11.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.4.192",
    "ultralytics-thop>=2.2.3",
]

[project.scripts]
yolov3 = "yolov3_project.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
